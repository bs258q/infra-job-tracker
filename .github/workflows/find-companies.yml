name: find-companies

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays, 8am PDT / 7am PST
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to search for (a profiles/*.toml name), or 'all'"
        type: string
        default: all
      recheck_only:
        description: "Skip Parallel; only recheck earlier finds (free)"
        type: boolean
        default: false

permissions:
  contents: write

# Shares the tracker's group so the two never push state at the same time.
concurrency: job-tracker

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE: ${{ inputs.profile || 'all' }}
      RECHECK_ONLY: ${{ inputs.recheck_only || false }}
      PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find companies
        run: |
          if [ "$PROFILE" = all ]; then profiles=$(ls profiles/*.toml | xargs -n1 basename | sed 's/\.toml$//'); else profiles=$PROFILE; fi
          flags=""
          [ "$RECHECK_ONLY" = true ] && flags="--recheck-only"
          echo "Companies found by [Parallel FindAll](https://docs.parallel.ai/findall-api/findall-quickstart) and checked against each company's job board (\`find_companies.py\`)." > "$RUNNER_TEMP/summary.md"
          echo "They are tracked from the next run. To drop one, delete its entry from \`companies/found/\`; its record in \`state/<profile>/discovery.json\` keeps it from coming back." >> "$RUNNER_TEMP/summary.md"
          echo >> "$RUNNER_TEMP/summary.md"
          for p in $profiles; do
            echo "::group::$p"
            python find_companies.py --profile "$p" $flags --wait-minutes 30 --summary "$RUNNER_TEMP/summary.md"
            echo "::endgroup::"
          done
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Found companies go straight to main, so the tracker picks them up on its next run.
      # A file that doesn't parse would break every tracker run, so it is dropped instead.
      - name: Start tracking found companies
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          for f in $(git ls-files --others --modified companies/found); do
            python -c "import sys, tomllib; tomllib.load(open(sys.argv[1], 'rb'))" "$f" || {
              echo "::error::$f is not valid TOML; not adding it"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            }
          done
          git add state/*/discovery.json companies/found 2>/dev/null || true
          added=$(git diff --cached --name-only -- companies/found | xargs)
          echo "added=$added" >> "$GITHUB_OUTPUT"
          if [ -n "$added" ]; then msg="Track companies found $(date -u +%F)"; else msg="Discovery log $(date -u +%F)"; fi
          git diff --cached --quiet || {
            git commit -m "$msg"
            git pull --rebase --autostash
            git push
          }

      - name: Email what was added
        if: steps.save.outputs.added != ''
        run: |
          python - "$RUNNER_TEMP/summary.md" <<'EOF'
          import html, sys, tracker
          text = open(sys.argv[1]).read()
          body = f"<pre style='font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap'>{html.escape(text)}</pre>"
          tracker.send_email("Job tracker: new companies added", body)
          EOF
