name: job-tracker

on:
  schedule:
    - cron: "0 14 * * *" # 7am PDT / 6am PST
    - cron: "0 1 * * *"  # 6pm PDT / 5pm PST
  workflow_dispatch:
    inputs:
      mode:
        description: "full = fetch, email, deploy; dry-run = print matches only; test-email = send a test email"
        type: choice
        options: [full, dry-run, test-email]
        default: full
      profile:
        description: "Profile to run (a profiles/*.toml name), or 'all'"
        type: string
        default: all

permissions:
  contents: write

concurrency: job-tracker

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODE: ${{ inputs.mode || 'full' }}
      PROFILE: ${{ inputs.profile || 'all' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick profiles
        run: |
          if [ "$PROFILE" = all ]; then
            echo "PROFILES=$(ls profiles/*.toml | xargs -n1 basename | sed 's/\.toml$//' | xargs)" >> "$GITHUB_ENV"
          else
            echo "PROFILES=$PROFILE" >> "$GITHUB_ENV"
          fi

      - name: Preview matches
        if: env.MODE == 'dry-run'
        run: |
          for p in $PROFILES; do
            echo "::group::$p"; python tracker.py --profile "$p" --dry-run; echo "::endgroup::"
          done

      - name: Send test email
        if: env.MODE == 'test-email'
        run: python tracker.py --test-email

      # One profile failing (or an email failure) shouldn't stop the others or the dashboard
      # from updating; the last step re-raises it.
      - name: Fetch roles and email new ones
        id: track
        if: env.MODE == 'full'
        continue-on-error: true
        run: |
          status=0
          for p in $PROFILES; do
            echo "::group::$p"
            python tracker.py --profile "$p" || { status=1; echo "::error::profile $p failed"; }
            echo "::endgroup::"
          done
          exit $status

      # Emails (deduped via state/storage-alert.json, committed below) when stored data nears its limits.
      - name: Check storage size
        if: env.MODE == 'full'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python storage_check.py

      - name: Save seen jobs and history
        if: env.MODE == 'full' && hashFiles('state/*/seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add state web/public/data/*/history.json web/public/data/profiles.json
          git diff --cached --quiet || git commit -m "Job snapshot $(date -u +%F-%H%M)"
          git push

      - uses: actions/setup-node@v4
        if: env.MODE == 'full' && env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Profiles not run this time (manual single-profile runs) have no jobs.json; regenerate them
      # without email so the deploy doesn't drop their data.
      - name: Fill in other profiles
        if: env.MODE == 'full' && env.PROFILE != 'all' && env.VERCEL_TOKEN != ''
        run: |
          for f in profiles/*.toml; do
            p=$(basename "$f" .toml)
            [ -f "web/public/data/$p/jobs.json" ] || python tracker.py --profile "$p" --no-email || true
          done
          git add state web/public/data/*/history.json web/public/data/profiles.json
          git diff --cached --quiet || { git commit -m "Job snapshot $(date -u +%F-%H%M)" && git push; }

      - name: Deploy dashboard
        if: env.MODE == 'full' && env.VERCEL_TOKEN != '' && hashFiles('web/public/data/*/jobs.json') != ''
        working-directory: web
        run: |
          npm ci
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Report tracker failure
        if: steps.track.outcome == 'failure'
        run: |
          echo "::error::tracker.py failed for at least one profile (see 'Fetch roles and email new ones'). Dashboard data was still saved/deployed if it was generated."
          exit 1
