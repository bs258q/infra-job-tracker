name: job-tracker

on:
  schedule:
    - cron: "0 14 * * *" # 7am PDT / 6am PST
    - cron: "0 1 * * *"  # 6pm PDT / 5pm PST
  workflow_dispatch:
    inputs:
      mode:
        description: "full = fetch + email new roles; dry-run = print matches only; test-email = send a test email"
        type: choice
        options: [full, dry-run, test-email]
        default: full

permissions:
  contents: write

concurrency: job-tracker

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preview matches
        if: env.MODE == 'dry-run'
        run: python tracker.py --dry-run

      - name: Send test email
        if: env.MODE == 'test-email'
        run: python tracker.py --test-email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Fetch roles and email new ones
        if: env.MODE == 'full'
        run: python tracker.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Save seen jobs
        if: env.MODE == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json latest.md
          git diff --cached --quiet || git commit -m "Job snapshot $(date -u +%F-%H%M)"
          git push
