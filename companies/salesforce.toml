# Salesforce-ecosystem employers, added on top of companies/tech.toml for the salesforce profile.
# Same format as tech.toml; `python discover.py "Company"` finds Greenhouse / Lever / Ashby slugs.

# ---------- Remote job boards (jobs carry their own employer name) ----------
[[company]]
name = "Himalayas (remote board)"
ats = "himalayas"
country = "US"
queries = ["salesforce developer", "salesforce administrator", "salesforce architect"]

[[company]]
name = "Remotive (remote board)"
ats = "remotive"
queries = ["salesforce"]

